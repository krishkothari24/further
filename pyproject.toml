[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "sophie-further"
version = "0.0.0"
description = "Canonical backend for the ACME Senior Living Sophie assignment"
requires-python = ">=3.11"
dependencies = ["pydantic==2.11.9", "openai==2.54.0", "fastapi==0.119.1", "uvicorn==0.38.0"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "PyYAML==6.0.2",
  "httpx==0.28.1",
  "ruff==0.14.3",
  "mypy==1.18.2",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
sophie = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
