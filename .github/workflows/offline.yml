name: Offline regression

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check backend evals tests scripts provider.py
      - run: ruff check backend evals tests scripts provider.py
      - run: mypy --follow-imports=skip --ignore-missing-imports backend/sophie/{contracts,state,llm,time_utils,runtime,facts,grounding,cli,scenarios,api}.py
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  promptfoo-offline:
    runs-on: ubuntu-latest
    env:
      SOPHIE_EVAL_MODE: offline
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PYTHONPATH: backend:.
      PROMPTFOO_PYTHON: .venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: npm ci
      - run: mkdir -p evals/artifacts
      - run: npx promptfoo eval --no-cache --no-write --no-table --no-progress-bar -o evals/artifacts/final-offline.json
      - run: .venv/bin/python scripts/report_eval_metrics.py evals/artifacts/final-offline.json
