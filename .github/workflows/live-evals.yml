name: Live Sophie evaluation

on:
  workflow_dispatch:

concurrency:
  group: live-sophie-evaluation
  cancel-in-progress: false

jobs:
  final-and-noisy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: backend:.
      PROMPTFOO_PYTHON: python
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      SOPHIE_EVAL_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: test -n "$OPENAI_API_KEY"
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: mkdir -p evals/artifacts
      - name: Final live cases
        run: npx promptfoo eval --grader openai:gpt-5 --no-cache --no-write --no-share --no-table --no-progress-bar -o evals/artifacts/final-live.json
      - run: python scripts/check_eval_gate.py --cases evals/cases.yaml --artifact evals/artifacts/final-live.json
      - name: Report final cost estimate
        if: always()
        run: test ! -f evals/artifacts/final-live.json || python scripts/report_eval_metrics.py evals/artifacts/final-live.json --grader-model gpt-5
      - name: Noisy live cases
        run: npx promptfoo eval -c evals/noisy_promptfooconfig.yaml --grader openai:gpt-5 --no-cache --no-write --no-share --no-table --no-progress-bar -o evals/artifacts/noisy-live.json
      - run: python scripts/check_eval_gate.py --cases evals/noisy_cases.yaml --artifact evals/artifacts/noisy-live.json
      - name: Report noisy cost estimate
        if: always()
        run: test ! -f evals/artifacts/noisy-live.json || python scripts/report_eval_metrics.py evals/artifacts/noisy-live.json --grader-model gpt-5
      - name: Report cumulative runtime estimate
        if: always()
        run: python scripts/report_usage_ledger.py
